<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <link rel="canonical" href="https://word-basketball-0204.firebaseapp.com/" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ff7a1a'/%3E%3Cpath d='M2 32h60M32 2c-12 9-12 51 0 60M32 2c12 9 12 51 0 60' fill='none' stroke='%2307111f' stroke-width='4'/%3E%3C/svg%3E" />
    <meta
      name="description"
      content="把每天的英文單字練習，變成一場四節籃球挑戰。"
    />
    <title>單字籃球王</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=20260829-2" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand-button" data-action="home" aria-label="回到首頁">
          <span class="brand-ball" aria-hidden="true"></span>
          <span>
            <strong>單字籃球王</strong>
            <small>WORD COURT</small>
          </span>
        </button>
        <button class="cloud-button" id="cloudButton" data-action="cloud" disabled aria-busy="true">
          <span class="cloud-dot" aria-hidden="true"></span>
          <span class="cloud-copy">
            <strong id="cloudLabel">登入準備中…</strong>
            <small id="cloudIdentity">正在確認玩家</small>
          </span>
        </button>
      </header>

      <main id="app" aria-live="polite"></main>

      <nav class="bottom-nav" aria-label="主要功能">
        <button data-action="home" class="nav-item is-active" id="homeNav">
          <span aria-hidden="true">⌂</span>
          首頁
        </button>
        <button data-action="stats" class="nav-item" id="statsNav">
          <span aria-hidden="true">▥</span>
          單字戰績
        </button>
        <button data-action="league" class="nav-item" id="leagueNav">
          <span aria-hidden="true">♟</span>
          球員榜
        </button>
        <button data-action="locker" class="nav-item" id="lockerNav">
          <span aria-hidden="true">★</span>
          更衣室
        </button>
      </nav>
    </div>

    <div class="toast" id="toast" role="status"></div>
    <div class="account-modal" id="accountModal" hidden></div>
    <script type="module" src="./app.js?v=20260829-2"></script>
  </body>
</html>
